<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BV-Note v2.0</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js">
</script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js">
</script>
<script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js">
</script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js">
</script>
<script defer src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.js">
</script>
</head>
<body>
<header>
<strong>BV-Note v2.0</strong>
<span id="filename">未命名.md</span>
<span id="status">準備就緒</span>
<div class="tools">
<button id="open">開啟</button>
<button id="save">儲存</button>
<button id="saveas">另存</button>
<button id="md">匯出 MD</button>
<button id="preview">重新渲染公式</button>
<button id="clear">新文件</button>
<input id="file" type="file" accept=".ainote,.json,.html,.htm,.md,.markdown,.txt" hidden>
</div>
</header>
<button id="explorer-toggle" aria-expanded="true" aria-controls="explorer" title="展開或收合 Explorer">☰ Explorer</button><div class="workspace"><aside id="explorer"><div class="explorer-title">EXPLORER</div><button id="root-open">選取本地 Root</button><div id="root-label">尚未選取 Root</div><div class="explorer-actions"><button id="add-fold">+Fold</button><button id="add-file">+File</button><button id="root-save">Save</button><button id="root-close">Close</button></div><div id="inline-name" hidden></div><div id="tree"></div></aside><main><div id="mode-indicator">編輯模式</div>
<article id="editor" contenteditable="true" spellcheck="false" autocorrect="off" autocapitalize="off" data-gramm="false" data-gramm_editor="false" aria-label="文件編輯區" data-placeholder="直接貼上 ChatGPT 內容或 Markdown，立即顯示排版結果…">
</article>
</main></div><div id="context-menu" hidden></div>
<footer>Ctrl+V 貼上圖片 / 文字 · Ctrl+S 儲存 · 支援拖曳圖片 · 所有開啟、儲存、下載均使用 Markdown 原始碼</footer>
<script src="renderer.js">
</script>
<script src="app.js">
</script>
<script src="explorer.js"></script></body>
</html>
