<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BV-Note v3.4.3</title>
<link rel="stylesheet" href="style.css?v=3.4.2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js">
</script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js">
</script>
<script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js">
</script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js">
</script>
<script defer src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.js">
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<header>
<strong>BV-Note v3.4.3</strong>
<span id="filename">未命名.md</span>
<span id="status">準備就緒</span>
<div class="tools"><div id="cloud-header-tools" hidden><button id="cloud-back-editor-button" type="button" title="回到 Markdown 編輯模式">← 回到編輯模式</button><button id="cloud-commit-button" type="button" class="cloud-commit-ready">Commit</button><button id="cloud-create-button" type="button">建立新雲端專案</button><button id="cloud-other-button" type="button" aria-expanded="false" aria-haspopup="true" aria-controls="cloud-operations">其它功能 ▾</button></div><div id="editor-header-tools">

<button id="toc-toggle">目錄</button>
<button id="saveas">另存</button>


<button id="clear">新文件</button>
<div class="settings-wrap"><button id="settings-toggle" aria-expanded="false">設定 ▾</button><div id="settings-menu" hidden><button id="save">儲存</button><button id="open">開啟舊文件</button><button id="md">匯出 MD</button><button id="preview">重新渲染公式</button><button id="settings-explorer" type="button">EXPLORER（開關）</button><button id="settings-text-tools" type="button">文本工具</button></div></div>
<input id="insert-image-file" type="file" accept="image/*" hidden><input id="file" type="file" accept=".ainote,.json,.html,.htm,.md,.markdown,.txt" hidden>
</div></div>
</header>
<div class="workspace"><aside id="explorer"><div class="explorer-title">EXPLORER <button id="cloud-page-toggle" type="button" title="切換雲端專案頁面" aria-label="切換雲端專案頁面">☁ 雲端</button></div><div class="root-toolbar"><button id="root-open">選取本地文件夾</button><button id="sider-close">CloseSider</button></div><div id="root-label">尚未選取 Root</div><div class="explorer-actions"><button id="add-fold">+Fold</button><button id="add-file">+File</button><button id="root-save">Save</button><button id="root-close">Close</button><button id="explorer-operate" aria-haspopup="true">Operate ▾</button></div><div id="inline-name" hidden></div><div id="tree"></div><div id="sider-resizer" role="separator" aria-label="調整 Explorer 寬度" aria-orientation="vertical" tabindex="0"></div></aside><main><div class="editor-topbar"><button id="sider-edge" aria-label="開啟 Explorer" title="開啟 Explorer">☰</button><div id="mode-indicator"></div></div>
<article id="editor" contenteditable="true" spellcheck="false" autocorrect="off" autocapitalize="off" data-gramm="false" data-gramm_editor="false" aria-label="文件編輯區" data-placeholder="直接貼上 ChatGPT 內容或 Markdown，立即顯示排版結果…">
</article>
</main><section id="cloud-page" hidden><div class="cloud-shell"><h2>雲端專案</h2><p class="cloud-muted">本地 Explorer 與雲端資料完全分離；雲端操作不會直接覆蓋本地檔案。</p><div id="cloud-message" role="status" aria-live="polite"></div><div id="cloud-progress" class="cloud-progress" hidden><div class="cloud-progress-info"><span id="cloud-progress-label">準備中…</span><span id="cloud-progress-percent">0%</span></div><progress id="cloud-progress-bar" max="100" value="0"></progress></div><div id="cloud-create-panel" class="cloud-panel" hidden><h3>建立雲端 Fold ZIP</h3><label>保存期限<select id="cloud-life-days"><option value="1">1 day</option><option value="7" selected>7 days</option><option value="14">14 days</option><option value="30">30 days</option><option value="90">90 days</option></select></label><div class="cloud-actions"><button id="cloud-create-confirm">建立並上傳</button><button id="cloud-create-cancel">取消</button></div></div><div id="cloud-commit-panel" class="cloud-panel" hidden><h3>提交雲端 Root ZIP</h3><p id="cloud-commit-target"></p><label><input type="radio" name="cloud-commit-mode" value="incremental" checked> 增量提交（內容未改變不建立新版本）</label><label><input type="radio" name="cloud-commit-mode" value="full"> 完整提交（建立完整新版本）</label><div id="cloud-commit-life" hidden><label>完整提交後保存期限<select id="cloud-commit-life-days"><option value="1">1 day</option><option value="7" selected>7 days</option><option value="14">14 days</option><option value="30">30 days</option><option value="90">90 days</option></select></label></div><div class="cloud-actions"><button id="cloud-commit-confirm" type="button">確認提交</button><button id="cloud-commit-cancel" type="button">取消</button></div></div><div class="cloud-panel"><h3>搜尋雲端文件</h3><div class="cloud-actions"><input id="cloud-search-input" placeholder="僅輸入完整 File Hash ID（UUID）"><button id="cloud-search-button">Search</button></div><div class="cloud-table-wrap"><table id="cloud-file-table"><thead><tr><th>文件名</th><th>File Hash ID</th><th>Commit 時間</th><th>到期時間</th><th>提交序列</th><th>操作</th></tr></thead><tbody></tbody></table></div></div><div class="cloud-panel"><h3>提交歷史</h3><div id="cloud-history">請在上方選擇文件以查看 Commit 紀錄。</div></div><input id="cloud-import-file" type="file" accept=".zip,.md,.txt" hidden></div></section></div><div id="context-menu" hidden></div><div id="cloud-operations" role="menu" aria-label="雲端其它功能" hidden><button id="cloud-import-button" type="button" role="menuitem">從雲端導入至 Explorer</button><button id="cloud-zip-button" type="button" role="menuitem">下載雲端專案 ZIP</button></div>
<footer>Ctrl+V 貼上圖片 / 文字 · Ctrl+S 儲存 · 支援拖曳圖片 · 所有開啟、儲存、下載均使用 Markdown 原始碼</footer>

<script src="pdf-viewer.js"></script><script src="explorer.js"></script><script src="mermaid-support.js"></script><script src="toc.js?v=3.4.2"></script><script src="cloud-config.js"></script><script src="cloud.js?v=3.4.3"></script></body>
