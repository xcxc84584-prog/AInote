<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BV-Note v2.3.9</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js">
</script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js">
</script>
<script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js">
</script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js">
</script>
<script defer src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.js">
</script>
</head>
<body>
<header>
<strong>BV-Note v2.3.9</strong>
<span id="filename">未命名.md</span>
<span id="status">準備就緒</span>
<div class="tools">

<button id="toc-toggle">目錄</button>
<button id="saveas">另存</button>


<button id="clear">新文件</button>
<div class="settings-wrap"><button id="settings-toggle" aria-expanded="false">設定 ▾</button><div id="settings-menu" hidden><button id="save">儲存</button><button id="open">開啟舊文件</button><button id="md">匯出 MD</button><button id="preview">重新渲染公式</button><button id="settings-explorer" type="button">EXPLORER（開關）</button><button id="settings-text-tools" type="button">文本工具</button></div></div>
<input id="insert-image-file" type="file" accept="image/*" hidden><input id="file" type="file" accept=".ainote,.json,.html,.htm,.md,.markdown,.txt" hidden>
</div>
</header>
<div class="workspace"><aside id="explorer"><div class="explorer-title">EXPLORER</div><div class="root-toolbar"><button id="root-open">選取本地文件夾</button><button id="sider-close">CloseSider</button></div><div id="root-label">尚未選取 Root</div><div class="explorer-actions"><button id="add-fold">+Fold</button><button id="add-file">+File</button><button id="root-save">Save</button><button id="root-close">Close</button><button id="explorer-operate" aria-haspopup="true">Operate ▾</button></div><div id="inline-name" hidden></div><div id="tree"></div><div id="sider-resizer" role="separator" aria-label="調整 Explorer 寬度" aria-orientation="vertical" tabindex="0"></div></aside><main><div class="editor-topbar"><button id="sider-edge" aria-label="開啟 Explorer" title="開啟 Explorer">☰</button><div id="mode-indicator"></div></div>
<article id="editor" contenteditable="true" spellcheck="false" autocorrect="off" autocapitalize="off" data-gramm="false" data-gramm_editor="false" aria-label="文件編輯區" data-placeholder="直接貼上 ChatGPT 內容或 Markdown，立即顯示排版結果…">
</article>
</main></div><div id="context-menu" hidden></div>
<footer>Ctrl+V 貼上圖片 / 文字 · Ctrl+S 儲存 · 支援拖曳圖片 · 所有開啟、儲存、下載均使用 Markdown 原始碼</footer>
<script src="renderer.js">
</script>
<script src="app.js">
</script>
<script src="explorer.js"></script><script src="toc.js"></script></body>
</html>
